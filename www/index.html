<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کولر هوشمند ESP32</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --font-fa:'Vazirmatn',-apple-system,sans-serif;
      --font-mono:'Vazirmatn',-apple-system,sans-serif;
      --bg:#0a0c0d; --panel:#1b1f21; --panel-2:#15181a; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
      --accent:#1de9c4; --accent-dim:rgba(29,233,196,.16); --on-accent:#00201b;
      --on:#1de9c4; --on-dim:rgba(29,233,196,.16); --off:#ff5468; --off-dim:rgba(255,84,104,.14);
      --warn:#f2a93b; --warn-dim:rgba(242,169,59,.14); --cyan:#29d3c8; --on-cyan:#04201d;
      --text:#eef0f1; --text-dim:#868c90; --text-faint:#585c5f; --nav-bg:rgba(15,18,19,.92); --panel-radius:14px; --btn-radius:12px;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    body{margin:0; background:#000; color:var(--text); font-family:var(--font-fa); display:flex; flex-direction:column; align-items:center;}
    .phone{width:100%; min-height:100vh; background:var(--bg); color:var(--text); display:flex; flex-direction:column; position:relative;}
    .topbar{padding:16px 18px; position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);}
    .top-row{display:flex; align-items:center; justify-content:space-between;}
    .brand-name{font-weight:800; font-size:1rem;}
    .brand-sub{font-family:var(--font-mono); font-size:.66rem; color:var(--text-faint);}
    .conn-badge{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-size:.7rem; font-weight:700; background:var(--warn-dim); color:var(--warn);}
    .conn-badge.connected{background:var(--on-dim); color:var(--on);}
    .conn-badge.disconnected{background:var(--off-dim); color:var(--off);}
    .pages{flex:1; padding:20px 18px 100px; width:100%;}
    .panel{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--panel-radius); padding:18px; margin-bottom:14px;}
    .hero{display:flex; flex-direction:column; align-items:center; padding:22px 18px 20px;}
    .status-word{font-weight:800; font-size:1.02rem; margin-top:10px;}
    .manual-btn{width:100%; padding:14px; border-radius:var(--btn-radius); border:1px solid var(--off-dim); background:var(--off-dim); color:var(--off); font-family:var(--font-fa); font-weight:700; margin-top:14px; cursor:pointer;}
    .manual-btn.isoff{border-color:var(--on-dim); background:var(--on-dim); color:var(--on);}
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="top-row">
        <div>
          <div class="brand-name">کولر هوشمند ESP32</div>
          <div class="brand-sub">ESP32 · TIMER HUB</div>
        </div>
        <div class="conn-badge" id="connection-status">در حال اتصال...</div>
      </div>
    </div>

    <div class="pages">
      <div class="panel hero" id="cooler-display-status">
        <div class="status-word" id="cooler-status-text">در حال دریافت وضعیت...</div>
        <button class="manual-btn isoff" id="manual-btn" onclick="toggleManual()">روشن / خاموش دستی</button>
      </div>

      <div class="panel">
        <h3>ساعت داخلی برد</h3>
        <div id="board-time" style="font-size: 1.4rem; font-weight: bold; color: var(--cyan); text-align: center; margin: 10px 0;">--:--:--</div>
        <button onclick="syncTime()" style="width:100%; padding:10px; background:var(--panel-2); border:1px solid var(--line-strong); color:#fff; border-radius:8px;">همگام‌سازی ساعت با گوشی</button>
      </div>
    </div>
  </div>

  <script>
    const ESP_IP = "http://192.168.4.1";

    function fetchStatus() {
      fetch(ESP_IP + '/status')
        .then(r => r.json())
        .then(data => {
          document.getElementById('connection-status').className = 'conn-badge connected';
          document.getElementById('connection-status').innerText = 'متصل';
          document.getElementById('board-time').innerText = data.time;
          document.getElementById('cooler-status-text').innerText = data.relay === 1 ? 'کولر روشن است' : 'کولر خاموش است';
        })
        .catch(err => {
          document.getElementById('connection-status').className = 'conn-badge disconnected';
          document.getElementById('connection-status').innerText = 'قطع ارتباط';
        });
    }

    function toggleManual() {
      fetch(ESP_IP + '/toggle-manual', { method: 'POST' })
        .then(() => fetchStatus());
    }

    function syncTime() {
      let now = new Date();
      let body = 'h=' + now.getHours() + '&m=' + now.getMinutes() + '&s=' + now.getSeconds() + '&y=' + now.getFullYear() + '&mon=' + (now.getMonth() + 1) + '&d=' + now.getDate() + '&wd=' + ((now.getDay() + 1) % 7);
      fetch(ESP_IP + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      }).then(() => alert('ساعت همگام شد'));
    }

    setInterval(fetchStatus, 1500);
    fetchStatus();
  </script>
</body>
</html>
