name: Build Android APK (Capacitor App)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Smart Cooler APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find App Directory & Install / Sync Capacitor
        run: |
          if [ -d "Android_App" ] && [ -f "Android_App/package.json" ]; then
            echo "APP_DIR=Android_App" >> $GITHUB_ENV
            cd Android_App
          elif [ -f "package.json" ]; then
            echo "APP_DIR=." >> $GITHUB_ENV
          else
            echo "Could not find package.json!" && exit 1
          fi
          npm install
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd ${{ env.APP_DIR }}/android
          chmod +x gradlew

      - name: Build Android APK (Debug & Release)
        run: |
          cd ${{ env.APP_DIR }}/android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stop Gradle Daemons Cleanly
        run: |
          cd ${{ env.APP_DIR }}/android
          ./gradlew --stop || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Cooler-ESP32-App-Debug
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release (Unsigned) APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Cooler-ESP32-App-Release
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
