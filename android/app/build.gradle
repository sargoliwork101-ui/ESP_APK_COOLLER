plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.cooler.smart'
    compileSdk 34

    defaultConfig {
        applicationId "ir.cooler.smart"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // بسته‌بندی وب به صورت asset محلی
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// تسک خودکار: قبل از هر بیلد، آخرین نسخه‌ی web/ را داخل assets کپی می‌کند
task copyWebAssets(type: Copy) {
    from '../../web'
    into 'src/main/assets/web'
}
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('assemble') || task.name.startsWith('bundle') || task.name.startsWith('merge') || task.name.startsWith('install')) {
        task.dependsOn copyWebAssets
    }
}
preBuild.dependsOn copyWebAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.android.material:material:1.10.0'
}
