<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کولر هوشمند ESP32 - دمو کامل</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-fa: 'Vazirmatn', -apple-system, sans-serif;
      --bg: #0a0c0d;
      --panel: #1b1f21;
      --panel-2: #15181a;
      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.14);
      --accent: #1de9c4;
      --accent-dim: rgba(29,233,196,.16);
      --on-accent: #00201b;
      --on: #1de9c4;
      --off: #ff5468;
      --warn: #f2a93b;
      --text: #eef0f1;
      --text-dim: #868c90;
      --panel-radius: 14px;
      --btn-radius: 12px;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #000;
      color: var(--text);
      font-family: var(--font-fa);
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    
    .phone {
      width: 100%;
      max-width: 380px;
      background: var(--bg);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 0 12px #111, 0 0 0 20px #222;
      border: 1px solid #333;
    }
    
    .topbar {
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    
    .brand {
      font-weight: 800;
      font-size: 1.05rem;
    }
    
    .pages {
      height: 620px;
      position: relative;
      overflow: hidden;
    }
    
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    
    .page.active {
      display: flex;
    }
    
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--panel-radius);
      padding: 18px;
    }
    
    .nav {
      display: flex;
      background: #111;
      padding: 8px;
    }
    
    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 600;
      border: none;
      background: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    
    .nav-btn.active {
      color: var(--accent);
    }
    
    .status-card {
      text-align: center;
      padding: 30px 20px;
    }
    
    .status-text {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    
    .btn {
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      padding: 14px;
      border-radius: var(--btn-radius);
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
      margin-top: 16px;
      cursor: pointer;
    }
    
    .btn.off {
      background: var(--off);
      color: white;
    }
    
    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
    }
    
    .scenario-item {
      background: var(--panel-2);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="phone">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">کولر هوشمند ESP32</div>
    <div style="font-size:0.72rem; color:#666; margin-top:2px;">192.168.4.1 • متصل</div>
  </div>

  <!-- Pages -->
  <div class="pages">
    
    <!-- HOME -->
    <div id="page-home" class="page active">
      <div class="panel status-card">
        <div style="font-size:3.2rem; margin-bottom:10px;">❄️</div>
        <div class="status-text" id="cooler-status">کولر خاموش است</div>
        <div style="color:#888; font-size:0.85rem;">حالت: خودکار (سناریو)</div>
        
        <button onclick="toggleCooler()" class="btn" id="manual-btn">
          روشن کردن دستی کولر
        </button>
      </div>
      
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:0.8rem; color:#888;">ساعت برد</div>
            <div style="font-size:1.55rem; font-weight:800;" id="board-time">14:32:05</div>
          </div>
          <button onclick="syncTime()" style="background:#222; color:#1de9c4; border:none; padding:8px 14px; border-radius:8px; font-size:0.78rem; font-weight:600;">
            همگام‌سازی
          </button>
        </div>
      </div>
    </div>

    <!-- SCENARIOS -->
    <div id="page-scenarios" class="page">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div style="font-weight:700;">برنامه‌ریزی سناریوها</div>
          <button onclick="addScenario()" style="background:var(--accent); color:#00201b; border:none; width:34px; height:34px; border-radius:8px; font-size:1.4rem; line-height:1;">+</button>
        </div>
        
        <div id="scenario-list"></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="page-settings" class="page">
      <div class="panel">
        <div style="font-weight:700; margin-bottom:14px;">تنظیمات</div>
        
        <div style="margin-bottom:14px;">
          <div style="font-size:0.82rem; color:#888; margin-bottom:4px;">آدرس IP برد</div>
          <input type="text" id="ip-input" value="192.168.4.1" style="width:100%; background:#222; border:1px solid #333; color:white; padding:11px; border-radius:8px;">
        </div>
        
        <button onclick="saveSettings()" class="btn">ذخیره تنظیمات</button>
      </div>
    </div>
    
  </div>

  <!-- Bottom Navigation -->
  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('home', this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
      <span>خانه</span>
    </button>
    <button class="nav-btn" onclick="switchTab('scenarios', this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span>سناریوها</span>
    </button>
    <button class="nav-btn" onclick="switchTab('settings', this)">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3v-.1a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15a1.7 1.7 0 0 0-1.56-1.03h-.1v-3h.1A1.7 1.7 0 0 0 7.06 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56v-.1h3v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.1v3h-.1A1.7 1.7 0 0 0 19.4 15z"/></svg>
      <span>تنظیمات</span>
    </button>
  </div>
</div>

<script>
// ==================== DEMO APP LOGIC ====================

let coolerOn = false;
let scenarios = [];

function switchTab(tab, element) {
  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  
  // Show target page
  document.getElementById('page-' + tab).classList.add('active');
  
  // Update nav buttons
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  element.classList.add('active');
}

function toggleCooler() {
  coolerOn = !coolerOn;
  updateCoolerUI();
}

function updateCoolerUI() {
  const status = document.getElementById('cooler-status');
  const btn = document.getElementById('manual-btn');
  
  if (coolerOn) {
    status.innerText = 'کولر روشن است';
    btn.innerText = 'خاموش کردن دستی کولر';
    btn.classList.add('off');
  } else {
    status.innerText = 'کولر خاموش است';
    btn.innerText = 'روشن کردن دستی کولر';
    btn.classList.remove('off');
  }
}

function syncTime() {
  const timeEl = document.getElementById('board-time');
  timeEl.innerText = new Date().toLocaleTimeString('fa-IR', {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
  
  // Fake success message
  const originalText = timeEl.innerText;
  setTimeout(() => {
    alert('ساعت با موفقیت با گوشی همگام‌سازی شد');
  }, 300);
}

function addScenario() {
  const name = prompt('نام سناریو:', 'سناریو جدید');
  if (!name) return;
  
  const start = prompt('ساعت شروع (مثال: 08:00):', '08:00');
  const end = prompt('ساعت پایان (مثال: 22:00):', '22:00');
  
  if (!start || !end) return;
  
  scenarios.push({
    id: Date.now(),
    name: name,
    start: start,
    end: end,
    active: true
  });
  
  renderScenarios();
}

function renderScenarios() {
  const container = document.getElementById('scenario-list');
  container.innerHTML = '';
  
  if (scenarios.length === 0) {
    container.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">هیچ سناریویی وجود ندارد</div>';
    return;
  }
  
  scenarios.forEach((s, index) => {
    const div = document.createElement('div');
    div.className = 'scenario-item';
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:600;">${s.name}</div>
          <div style="font-size:0.85rem; color:#888;">${s.start} - ${s.end}</div>
        </div>
        <div>
          <button onclick="toggleScenario(${index})" style="background:${s.active ? '#3ddc84' : '#555'}; color:white; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem;">
            ${s.active ? 'فعال' : 'غیرفعال'}
          </button>
          <button onclick="deleteScenario(${index})" style="background:#ff5468; color:white; border:none; padding:4px 8px; border-radius:6px; font-size:0.75rem; margin-right:6px;">حذف</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleScenario(index) {
  scenarios[index].active = !scenarios[index].active;
  renderScenarios();
}

function deleteScenario(index) {
  if (confirm('آیا مطمئن هستید؟')) {
    scenarios.splice(index, 1);
    renderScenarios();
  }
}

function saveSettings() {
  const ip = document.getElementById('ip-input').value;
  alert('تنظیمات با موفقیت ذخیره شد\nآدرس IP جدید: ' + ip);
}

// Auto update time
function updateTime() {
  const timeEl = document.getElementById('board-time');
  if (timeEl) {
    const d = new Date();
    timeEl.innerText = d.toLocaleTimeString('fa-IR', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
  }
}

// Initialize
function initDemo() {
  // Add some default scenarios
  scenarios = [
    { id: 1, name: 'سناریو روزانه', start: '08:00', end: '22:00', active: true },
    { id: 2, name: 'سناریو شب', start: '23:00', end: '06:00', active: false }
  ];
  
  renderScenarios();
  
  // Update time every second
  setInterval(updateTime, 1000);
  updateTime();
  
  // Initial cooler state
  updateCoolerUI();
}

initDemo();
</script>

</body>
</html>
